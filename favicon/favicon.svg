<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <!-- Importação da fonte Orbitron direto no SVG -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
      
      .texto-neon {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 42px; /* Tamanho matematicamente igual para ZU e 3D */
        fill: url(#gradNeon);
        filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.8));
      }
    </style>

    <!-- Gradiente Neon (Verde claro para Esmeralda) -->
    <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"></stop>
      <stop offset="100%" stop-color="#10b981"></stop>
    </linearGradient>
    
    <!-- Gradiente de Fundo (Verde muito escuro) -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"></stop>
      <stop offset="100%" stop-color="#022c22"></stop>
    </linearGradient>
  </defs><rect width="120" height="120" rx="28" fill="url(#bgDark)"></rect><text x="60" y="53" text-anchor="middle" class="texto-neon" letter-spacing="-1">ZU</text><text x="60" y="91" text-anchor="middle" class="texto-neon" letter-spacing="-1">3D</text></svg>